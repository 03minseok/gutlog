<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0">
<style>
body{margin:0;background:#EEF1F5;color:#16202E;font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
a{color:#2B63CC;text-decoration:none}a:hover{color:#1E4FA8;text-decoration:underline}
input,textarea{font-family:inherit}textarea::placeholder{color:#8A94A3}
.ms{font-family:"Material Symbols Rounded";font-weight:500;font-size:24px;line-height:1;font-feature-settings:"liga"}
</style>
</helmet>

<section style="padding:48px;display:flex;flex-direction:column;gap:24px">
  <div style="display:flex;align-items:baseline;gap:12px">
    <h1 style="margin:0;font-size:28px;font-weight:700;letter-spacing:-0.02em">배변 기록</h1>
    <span style="font-size:15px;color:#6B7686">390 × 844</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start">
    <div id="3a" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:8px"><span style="padding:3px 9px;border-radius:6px;background:#16202E;color:#fff;font-size:13px;font-weight:700">3a</span><span style="font-size:15px;font-weight:600;color:#3F4A5A">배변 기록 입력</span></div>
      <div data-screen-label="04 배변 기록" style="width:390px;height:844px;background:#fff;border-radius:44px;overflow:hidden;box-shadow:0 20px 50px rgba(22,32,46,0.14);display:flex;flex-direction:column;position:relative">
        <div style="height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:15px;font-weight:600"><span>9:41</span><span style="display:flex;gap:4px"><span class="ms" style="font-size:18px">signal_cellular_alt</span><span class="ms" style="font-size:18px">wifi</span><span class="ms" style="font-size:18px">battery_full</span></span></div>
        <div style="height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid #F1F3F6">
          <a href="#" aria-label="닫기" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#16202E;border-radius:12px"><span class="ms">close</span></a>
          <span style="width:28px;height:28px;border-radius:8px;background:#E3F3F8;color:#0B6E8C;display:flex;align-items:center;justify-content:center"><span class="ms" style="font-size:18px">water_drop</span></span>
          <span style="font-size:17px;font-weight:700">배변 기록</span>
        </div>

        <div style="flex:1;overflow-y:auto;padding:20px 20px 24px;display:flex;flex-direction:column;gap:28px">
          <div style="display:flex;flex-direction:column;gap:8px">
            <span style="font-size:15px;font-weight:700">언제였나요?</span>
            <div style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:8px">
              <label style="position:relative;height:56px;border:1.5px solid #E3E7ED;border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#16202E" style-focus-within="border-color:#2B63CC">
                <span class="ms" style="font-size:20px;color:#6B7686">calendar_today</span>
                <input type="date" value="{{ date }}" onChange="{{ onDate }}" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;font-weight:600;color:#16202E;padding:0">
              </label>
              <label style="position:relative;height:56px;border:1.5px solid #E3E7ED;border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#16202E">
                <span class="ms" style="font-size:20px;color:#6B7686">schedule</span>
                <input type="time" value="{{ time }}" onChange="{{ onTime }}" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;font-weight:600;color:#16202E;padding:0">
              </label>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:8px">
            <span style="font-size:15px;font-weight:700">배변 양상</span>
            <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
              <sc-for list="{{ shapes }}" as="o" hint-placeholder-count="6">
                <button type="button" onClick="{{ o.pick }}" style="min-height:56px;border-radius:14px;border:{{ o.border }};background:{{ o.bg }};padding:10px 14px;font:inherit;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer">
                  <span style="display:flex;flex-direction:column;gap:2px">
                    <span style="font-size:16px;font-weight:{{ o.weight }};color:{{ o.fg }}">{{ o.label }}</span>
                    <span style="font-size:12px;color:#6B7686">{{ o.desc }}</span>
                  </span>
                  <span class="ms" style="font-size:20px;color:{{ o.fg }};opacity:{{ o.checkOpacity }}">check</span>
                </button>
              </sc-for>
            </div>
          </div>

          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:0 16px;border-radius:16px;background:{{ bloodBg }};border:1.5px solid {{ bloodBorder }}">
            <span style="display:flex;align-items:center;gap:10px">
              <span class="ms" style="font-size:22px;color:{{ bloodIcon }}">emergency</span>
              <span style="display:flex;flex-direction:column;gap:2px">
                <span style="font-size:16px;font-weight:700;color:{{ bloodFg }}">혈변</span>
                <span style="font-size:13px;color:#6B7686">{{ bloodLabel }}</span>
              </span>
            </span>
            <button type="button" role="switch" aria-checked="{{ blood }}" onClick="{{ toggleBlood }}" style="width:60px;height:34px;border:0;border-radius:999px;background:{{ toggleBg }};padding:3px;display:flex;justify-content:{{ toggleJustify }};cursor:pointer;flex:none">
              <span style="width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(22,32,46,0.2)"></span>
            </button>
          </div>

          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;justify-content:space-between;align-items:baseline">
              <span style="font-size:15px;font-weight:700">통증 정도</span>
              <span style="font-size:15px;font-weight:600;color:{{ painColor }}"><span style="font-size:24px;font-weight:700">{{ pain }}</span> / 10 · {{ painLabel }}</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px">
              <sc-for list="{{ painRow1 }}" as="p" hint-placeholder-count="6">
                <button type="button" onClick="{{ p.pick }}" style="height:48px;border-radius:12px;border:0;background:{{ p.bg }};color:{{ p.fg }};font:inherit;font-size:17px;font-weight:{{ p.weight }};cursor:pointer">{{ p.n }}</button>
              </sc-for>
            </div>
            <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:-4px">
              <sc-for list="{{ painRow2 }}" as="p" hint-placeholder-count="5">
                <button type="button" onClick="{{ p.pick }}" style="height:48px;border-radius:12px;border:0;background:{{ p.bg }};color:{{ p.fg }};font:inherit;font-size:17px;font-weight:{{ p.weight }};cursor:pointer">{{ p.n }}</button>
              </sc-for>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:13px;color:#6B7686"><span>0 통증 없음</span><span>10 참을 수 없음</span></div>
          </div>

          <label style="display:flex;flex-direction:column;gap:8px">
            <span style="font-size:15px;font-weight:700">메모 <span style="font-weight:500;color:#6B7686">(선택)</span></span>
            <textarea value="{{ memo }}" onChange="{{ onMemo }}" rows="3" placeholder="급박감, 잔변감, 점액 등 특이사항" style="border:1.5px solid #E3E7ED;border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.5;color:#16202E;outline:none;resize:none" style-focus="border-color:#2B63CC;box-shadow:0 0 0 3px #E6EEFB"></textarea>
          </label>
        </div>

        <div style="flex:none;padding:12px 20px 32px;border-top:1px solid #F1F3F6;background:#fff">
          <button disabled="{{ saveDisabled }}" onClick="{{ save }}" style="width:100%;height:56px;border:0;border-radius:14px;background:{{ saveBg }};color:{{ saveFg }};font:inherit;font-size:17px;font-weight:600;cursor:pointer">{{ saveLabel }}</button>
        </div>

        <sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:20px;right:20px;bottom:108px;min-height:52px;border-radius:14px;background:#16202E;color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;font-weight:500;box-shadow:0 8px 20px rgba(22,32,46,0.2)">
            <span class="ms" style="font-size:20px;color:#7FD6C9">check_circle</span>배변 기록을 저장했어요
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { ...this.now(), shape: null, blood: false, pain: 0, memo: '', saved: false };
  }
  now() {
    const d = new Date(), z = n => String(n).padStart(2, '0');
    return { date: `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`, time: `${z(d.getHours())}:${z(d.getMinutes())}` };
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const s = this.state;
    const SHAPES = [['hard', '딱딱함', '덩어리·힘줘야 나옴'], ['normal', '보통', '부드럽고 형태 있음'], ['soft', '무름', '형태가 약간 풀림'], ['mushy', '진흙 같음', '형태 거의 없음'], ['watery', '물설사', '액체 상태'], ['mucus', '점액만', '변 없이 점액']];
    const shapes = SHAPES.map(([k, label, desc]) => {
      const on = s.shape === k;
      return { label, desc, pick: () => this.setState({ shape: k }), border: on ? '2px solid #2B63CC' : '1.5px solid #E3E7ED', bg: on ? '#F3F7FD' : '#fff', fg: on ? '#1E4FA8' : '#16202E', weight: on ? 700 : 600, checkOpacity: on ? 1 : 0 };
    });
    const painLabel = s.pain === 0 ? '없음' : s.pain <= 3 ? '약함' : s.pain <= 6 ? '중간' : '심함';
    const painColor = s.pain <= 3 ? '#1E4FA8' : s.pain <= 6 ? '#A34B0B' : '#B42D32';
    const painBtn = n => {
      const on = s.pain === n;
      return { n, pick: () => this.setState({ pain: n }), bg: on ? '#2B63CC' : '#F1F3F6', fg: on ? '#fff' : '#3F4A5A', weight: on ? 700 : 500 };
    };
    const ok = !!s.shape;
    return {
      date: s.date, time: s.time,
      onDate: e => this.setState({ date: e.target.value }), onTime: e => this.setState({ time: e.target.value }),
      setNow: () => this.setState(this.now()),
      shapes,
      blood: s.blood, toggleBlood: () => this.setState({ blood: !s.blood }),
      bloodBg: s.blood ? '#FCEAEA' : '#fff', bloodBorder: s.blood ? '#F2C4C6' : '#E3E7ED',
      bloodIcon: s.blood ? '#B42D32' : '#C9D0DA', bloodFg: s.blood ? '#B42D32' : '#16202E',
      bloodLabel: s.blood ? '피가 섞여 있었어요' : '피가 보이지 않았어요',
      toggleBg: s.blood ? '#B42D32' : '#C9D0DA', toggleJustify: s.blood ? 'flex-end' : 'flex-start',
      pain: s.pain, painLabel, painColor,
      painRow1: [0, 1, 2, 3, 4, 5].map(painBtn), painRow2: [6, 7, 8, 9, 10].map(painBtn),
      memo: s.memo, onMemo: e => this.setState({ memo: e.target.value }),
      saveDisabled: !ok, saveBg: ok ? '#2B63CC' : '#E3E7ED', saveFg: ok ? '#fff' : '#6B7686',
      saveLabel: ok ? '저장' : '배변 양상을 선택하세요',
      saved: s.saved,
      save: () => { this.setState({ saved: true }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ saved: false }), 1800); }
    };
  }
}
</script>
</body>
</html>
