spring:
  application:
    name: gutlog

  datasource:
    url: jdbc:h2:file:./data/gutlog
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: gutlog-dev-secret-key-for-local-testing-environment-2026-very-long-key
  expiration: 3600000 # 1 hour in milliseconds

  h2:
    console:
      enabled: true