# 테스트 전용 설정: 파일 DB(./data/gutlog) 대신 인메모리 H2를 써서 개발 데이터와 분리한다.
spring:
  datasource:
    url: jdbc:h2:mem:gutlog-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: gutlog-test-secret-key-for-unit-testing-only-must-be-32-bytes-or-more
  expiration: 3600000
